<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GLA Swine Family Tree Visualizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #F8FAFC; color: #1E293B; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: #FFFFFF; padding: 25px; background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%); border-radius: 12px; margin-bottom: 25px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .search-box { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .search-box input { width: 40%; padding: 12px 20px; font-size: 16px; border: 2px solid #CBD5E1; border-radius: 8px; outline: none; }
        .search-box input:focus { border-color: #3B82F6; }
        .section-title { border-left: 6px solid #1E3A8A; padding-left: 15px; color: #1E3A8A; font-weight: 800; font-size: 18px; margin: 25px 0 15px 0; }
        
        /* 視覺化樹狀圖核心佈局 */
        .tree-root-box { background: #1E3A8A; color: white; padding: 15px 25px; border-radius: 10px; font-weight: 800; font-size: 18px; display: inline-block; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .tree-branch-container { display: flex; flex-direction: column; gap: 15px; position: relative; padding-left: 30px; border-left: 3px solid #3B82F6; margin-left: 15px; }
        .tree-node-item { background: white; border: 2px solid #CBD5E1; border-radius: 10px; padding: 15px 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; align-items: center; position: relative; }
        .tree-node-item::before { content: ""; position: absolute; left: -30px; top: 50%; width: 27px; height: 3px; background: #3B82F6; }
        
        .node-tag { font-size: 13px; font-weight: 700; color: #64748B; text-transform: uppercase; }
        .node-val { font-size: 15px; font-weight: 800; color: #1E3A8A; }

        /* 育種指標卡片 */
        .card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #E2E8F0; border-top: 4px solid #3B82F6; text-align: center; }
        .card-label { font-size: 12px; color: #64748B; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        .card-value { font-size: 18px; color: #1E3A8A; font-weight: 800; }
        .loading-status { text-align: center; font-weight: bold; color: #3B82F6; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🧬 GLA SWINE FAMILY TREE & BREEDING SYSTEM</h1>
        <p style="opacity: 0.8; font-size: 14px;">Visual Hierarchical Family Tree & Genetic Evaluation</p>
    </div>

    <div id="status" class="loading-status">🔄 Syncing live cloud database from Google Sheets...</div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Enter Sow ID (e.g., D1052) to draw family tree..." onkeyup="handleSearch()">
    </div>

    <div id="results"></div>
</div>

<script>
    let familyData = [];
    let valueData = [];

    const SHEET_ID = "17TEL9lgV_3PzWUW0xj63LEiipyl5j_0W5BJjSVi89kA";
    const FAMILY_GID = "0";
    const VALUE_GID = "1096695189";

    async function loadCloudData() {
        try {
            let famUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${FAMILY_GID}`;
            let valUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${VALUE_GID}`;

            Papa.parse(famUrl, { download: true, header: false, complete: function(results) { familyData = results.data; checkLoaded(); } });
            Papa.parse(valUrl, { download: true, header: true, complete: function(results) { valueData = results.data; checkLoaded(); } });
        } catch (e) {
            document.getElementById('status').innerHTML = "❌ Cloud data connection failed.";
        }
    }

    let loadedCount = 0;
    function checkLoaded() {
        loadedCount++;
        if (loadedCount >= 2) { document.getElementById('status').innerHTML = "✅ Database synced! Enter an ear tag to draw the family tree."; }
    }

    loadCloudData();

    function handleSearch() {
        let query = document.getElementById('searchInput'].value.trim().toLowerCase();
        let resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = "";

        if (!query) return;

        // 1. 繪製家族樹狀圖 (Family Tree Branches)
        let matchedFamily = familyData.filter(row => Object.values(row).join(' ').toLowerCase().includes(query));

        let html = `<div class="section-title">I. 🧬 Visual Family Tree Structure</div>`;
        if (matchedFamily.length > 0) {
            html += `<div class="tree-root-box">♀ Core Sow / Target: ${query.toUpperCase()}</div>`;
            html += `<div class="tree-branch-container">`;
            matchedFamily.slice(0, 12).forEach((row, index) => {
                html += `
                <div class="tree-node-item">
                    <div>
                        <div class="node-tag">Branch #${index + 1} (Generation)</div>
                        <div class="node-val">${row[1] || 'N/A'}</div>
                    </div>
                    <div>
                        <div class="node-tag">♂ Sire (公豬)</div>
                        <div class="node-val" style="color:#3B82F6;">${row[0] || 'N/A'}</div>
                    </div>
                    <div>
                        <div class="node-tag">Breed & Dam</div>
                        <div class="node-val" style="color:#10B981;">[${row[2] || 'N/A'}] ${row[6] || 'N/A'}</div>
                    </div>
                </div>`;
            });
            html += `</div>`;
        } else {
            html += `<p>No family tree branches found for this ID.</p>`;
        }

        // 2. 育種表現與指標卡片
        let matchedValue = valueData.filter(row => {
            let tag = row['母豬耳號(Sow Ear Tag)'] || '';
            return String(tag).toLowerCase().includes(query);
        });

        html += `<div class="section-title" style="margin-top:30px;">II. 📊 Genetic Breeding Performance Indicators</div>`;
        if (matchedValue.length > 0) {
            matchedValue.forEach(row => {
                html += `
                <p><b>Target Ear Tag: ${row['母豬耳號(Sow Ear Tag)']} (Breed: ${row['品種(Breed)']||'N/A'})</b></p>
                <div class="card-grid">
                    <div class="card"><div class="card-label">Total Parities</div><div class="card-value">${row['累計記錄胎數(Total Parities)']||'N/A'}</div></div>
                    <div class="card"><div class="card-label">Selection Index</div><div class="card-value" style="color:#10B981;">${row['🏆 育種選拔指數(Selection Index)']||'N/A'}</div></div>
                    <div class="card"><div class="card-label">Farrowing Rate</div><div class="card-value">${row['個體成功分娩率(Farrowing Rate %)']||'0'}%</div></div>
                    <div class="card"><div class="card-label">Selection Comment</div><div class="card-value" style="font-size:12px;">${row['選拔評價與行動建議(Selection Comment)']||'N/A'}</div></div>
                </div>`;
            });
        } else {
            html += `<p>No detailed breeding performance records found for this ear tag.</p>`;
        }

        resultsDiv.innerHTML = html;
    }
</script>
</body>
</html>
