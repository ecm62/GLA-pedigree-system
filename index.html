<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GLA Swine Pedigree Family Tree Diagram</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #F8FAFC; color: #1E293B; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: #FFFFFF; padding: 25px; background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%); border-radius: 12px; margin-bottom: 25px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .search-box { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .search-box input { width: 40%; padding: 12px 20px; font-size: 16px; border: 2px solid #CBD5E1; border-radius: 8px; outline: none; }
        .search-box input:focus { border-color: #3B82F6; }
        .section-title { border-left: 6px solid #1E3A8A; padding-left: 15px; color: #1E3A8A; font-weight: 800; font-size: 18px; margin: 25px 0 15px 0; }
        
        /* 樹狀圖結構樣式 */
        .tree-box { background: white; border: 2px solid #CBD5E1; border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .root-node { background: #1E3A8A; color: white; padding: 12px 25px; border-radius: 8px; font-weight: 800; font-size: 16px; display: inline-block; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .branch-list { display: flex; flex-direction: column; gap: 15px; position: relative; padding-left: 30px; border-left: 4px solid #3B82F6; margin-left: 10px; }
        .branch-card { background: #F8FAFC; border: 1px solid #CBD5E1; border-radius: 8px; padding: 15px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; align-items: center; position: relative; }
        .branch-card::before { content: ""; position: absolute; left: -30px; top: 50%; width: 26px; height: 3px; background: #3B82F6; }
        .node-label { font-size: 11px; color: #64748B; font-weight: 700; text-transform: uppercase; margin-bottom: 3px; }
        .node-val { font-size: 15px; font-weight: 800; color: #1E293B; }

        .card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #E2E8F0; border-top: 4px solid #3B82F6; text-align: center; }
        .card-label { font-size: 12px; color: #64748B; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        .card-value { font-size: 18px; color: #1E3A8A; font-weight: 800; }
        .loading-status { text-align: center; font-weight: bold; color: #3B82F6; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🧬 GLA SWINE PEDIGREE FAMILY TREE DIAGRAM</h1>
        <p style="opacity: 0.8; font-size: 14px;">Live Google Sheets Cloud-Synced Pedigree Chart & Genetic Analysis</p>
    </div>

    <div id="status" class="loading-status">🔄 Connecting and syncing live data from Google Sheets...</div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Enter Sow or Boar ID (e.g., D1052) to generate chart..." onkeyup="handleSearch()">
    </div>

    <div id="results"></div>
</div>

<script>
    let familyData = [];
    let valueData = [];

    const SHEET_ID = "17TEL9lgV_3PzWUW0xj63LEiipyl5j_0W5BJjSVi89kA";
    const FAMILY_GID = "0";
    const VALUE_GID = "1096695189";

    async function loadCloudData() {
        try {
            let targetFamUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${FAMILY_GID}`;
            let targetValUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${VALUE_GID}`;
            
            let famUrl = `https://api.allorigins.win/raw?url=` + encodeURIComponent(targetFamUrl);
            let valUrl = `https://api.allorigins.win/raw?url=` + encodeURIComponent(targetValUrl);

            Papa.parse(famUrl, {
                download: true,
                header: false,
                complete: function(results) { familyData = results.data; checkLoaded(); }
            });

            Papa.parse(valUrl, {
                download: true,
                header: true,
                complete: function(results) { valueData = results.data; checkLoaded(); }
            });
        } catch (e) {
            document.getElementById('status').innerHTML = "❌ Cloud data connection failed.";
        }
    }

    let loadedCount = 0;
    function checkLoaded() {
        loadedCount++;
        if (loadedCount >= 2) {
            document.getElementById('status').innerHTML = "✅ Live cloud database synced! Enter an ID to generate the pedigree tree.";
        }
    }

    loadCloudData();

    function handleSearch() {
        let query = document.getElementById('searchInput').value.trim().toLowerCase();
        let resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = "";

        if (!query) return;

        let matchedFamily = familyData.filter(row => Object.values(row).join(' ').toLowerCase().includes(query));

        let html = `<div class="section-title">I. 🧬 Pedigree Family Tree Diagram</div>`;
        if (matchedFamily.length > 0) {
            html += `<div class="tree-box">`;
            html += `<div class="root-node">♀ Target ID: ${query.toUpperCase()}</div>`;
            html += `<div class="branch-list">`;
            
            matchedFamily.slice(0, 10).forEach((row, index) => {
                let sire = row[0] ? String(row[0]) : "N/A";
                let gen = row[1] ? String(row[1]) : "N/A";
                let breed = row[2] ? String(row[2]) : "N/A";
                let dam = row[6] ? String(row[6]) : "N/A";

                html += `
                <div class="branch-card">
                    <div>
                        <div class="node-label">Generation / 代數</div>
                        <div class="node-val">${gen}</div>
                    </div>
                    <div>
                        <div class="node-label">♂ Sire (公豬)</div>
                        <div class="node-val" style="color:#3B82F6;">${sire}</div>
                    </div>
                    <div>
                        <div class="node-label">Breed & Dam (品種 / 母系)</div>
                        <div class="node-val" style="color:#10B981;">[${breed}] ${dam}</div>
                    </div>
                </div>`;
            });
            html += `</div></div>`;
        } else {
            html += `<p>No pedigree tree branches found for this ID.</p>`;
        }

        let matchedValue = valueData.filter(row => {
            let tag = row['母豬耳號(Sow Ear Tag)'] || '';
            return String(tag).toLowerCase().includes(query);
        });

        html += `<div class="section-title" style="margin-top:30px;">II. 📊 Genetic Breeding Performance Indicators</div>`;
        if (matchedValue.length > 0) {
            matchedValue.forEach(row => {
                html += `
                <p><b>Target Ear Tag: ${row['母豬耳號(Sow Ear Tag)']} (Breed: ${row['品種(Breed)']||'N/A'})</b></p>
                <div class="card-grid">
                    <div class="card"><div class="card-label">Total Parities</div><div class="card-value">${row['累計記錄胎數(Total Parities)']||'N/A'}</div></div>
                    <div class="card"><div class="card-label">Selection Index</div><div class="card-value" style="color:#10B981;">${row['🏆 育種選拔指數(Selection Index)']||'N/A'}</div></div>
                    <div class="card"><div class="card-label">Farrowing Rate</div><div class="card-value">${row['個體成功分娩率(Farrowing Rate %)']||'0'}%</div></div>
                    <div class="card"><div class="card-label">Selection Comment</div><div class="card-value" style="font-size:12px;">${row['選拔評價與行動建議(Selection Comment)']||'N/A'}</div></div>
                </div>`;
            });
        } else {
            html += `<p>No detailed breeding performance records found for this ear tag.</p>`;
        }

        resultsDiv.innerHTML = html;
    }
</script>
</body>
</html>
