<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GLA Swine Pedigree Tree & Breeding System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #F8FAFC; color: #1E293B; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: #FFFFFF; padding: 25px; background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%); border-radius: 12px; margin-bottom: 25px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .search-box { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .search-box input { width: 40%; padding: 12px 20px; font-size: 16px; border: 2px solid #CBD5E1; border-radius: 8px; outline: none; }
        .search-box input:focus { border-color: #3B82F6; }
        .section-title { border-left: 6px solid #1E3A8A; padding-left: 15px; color: #1E3A8A; font-weight: 800; font-size: 18px; margin: 25px 0 15px 0; }
        
        /* 視覺化樹狀圖節點樣式 */
        .tree-container { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
        .tree-node-card { background: white; border: 2px solid #3B82F6; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); position: relative; }
        .tree-node-header { background: #1E3A8A; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; font-size: 14px; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .tree-branches { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .branch-panel { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 8px; padding: 15px; }
        .branch-panel.sire { border-left: 5px solid #3B82F6; }
        .branch-panel.dam { border-left: 5px solid #10B981; }
        .branch-label { font-size: 12px; font-weight: 700; color: #64748B; text-transform: uppercase; margin-bottom: 5px; }
        .branch-content { font-size: 16px; font-weight: 800; color: #1E293B; }

        /* 保留您喜歡的完美育種指標卡片樣式 */
        .card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #E2E8F0; border-top: 4px solid #3B82F6; text-align: center; }
        .card-label { font-size: 12px; color: #64748B; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        .card-value { font-size: 18px; color: #1E3A8A; font-weight: 800; }
        .loading-status { text-align: center; font-weight: bold; color: #3B82F6; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🧬 GLA SWINE PEDIGREE TREE & BREEDING SYSTEM</h1>
        <p style="opacity: 0.8; font-size: 14px;">Visual Family Tree Structure & Genetic Evaluation Analysis</p>
    </div>

    <div id="status" class="loading-status">🔄 Syncing live cloud database from Google Sheets...</div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Enter Sow or Boar Ear Tag (e.g., D1052)..." onkeyup="handleSearch()">
    </div>

    <div id="results"></div>
</div>

<script>
    let familyData = [];
    let valueData = [];

    const SHEET_ID = "17TEL9lgV_3PzWUW0xj63LEiipyl5j_0W5BJjSVi89kA";
    const FAMILY_GID = "0";
    const VALUE_GID = "1096695189";

    async function loadCloudData() {
        try {
            let famUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${FAMILY_GID}`;
            let valUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${VALUE_GID}`;

            Papa.parse(famUrl, {
                download: true,
                header: false,
                complete: function(results) { familyData = results.data; checkLoaded(); }
            });

            Papa.parse(valUrl, {
                download: true,
                header: true,
                complete: function(results) { valueData = results.data; checkLoaded(); }
            });
        } catch (e) {
            document.getElementById('status').innerHTML = "❌ Cloud data connection failed.";
        }
    }

    let loadedCount = 0;
    function checkLoaded() {
        loadedCount++;
        if (loadedCount >= 2) {
            document.getElementById('status').innerHTML = "✅ Database synced! Enter an ear tag to generate the visual pedigree tree.";
        }
    }

    loadCloudData();

    function handleSearch() {
        let query = document.getElementById('searchInput').value.trim().toLowerCase();
        let resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = "";

        if (!query) return;

        // 1. 產生視覺化家族樹狀圖 (Family Tree Structure)
        let matchedFamily = familyData.filter(row => {
            let rowStr = Object.values(row).join(' ').toLowerCase();
            return rowStr.includes(query);
        });

        let html = `<div class="section-title">I. 🧬 Visual Pedigree Tree Structure (Found ${matchedFamily.length} relations)</div>`;
        if (matchedFamily.length > 0) {
            html += `<div class="tree-container">`;
            matchedFamily.slice(0, 15).forEach((row, index) => {
                html += `
                <div class="tree-node-card">
                    <div class="tree-node-header">
                        <span>🌳 Branch Node #${index + 1}</span>
                        <span>Generation / 代數: ${row[1]||'N/A'} | Breed: ${row[2]||'N/A'}</span>
                    </div>
                    <div class="tree-branches">
                        <div class="branch-panel sire">
                            <div class="branch-label">♂ Sire Information (父系 / 公豬)</div>
                            <div class="branch-content">${row[0]||'N/A'}</div>
                        </div>
                        <div class="branch-panel dam">
                            <div class="branch-label">♀ Dam Information (母系 / 母豬)</div>
                            <div class="branch-content">${row[6]||'N/A'}</div>
                        </div>
                    </div>
                </div>`;
            });
            html += `</div>`;
        } else {
            html += `<p>No matching pedigree tree branches found for this ID.</p>`;
        }

        // 2. 完美的育種指標表現 (保留您原本喜歡的精準版型)
        let matchedValue = valueData.filter(row => {
            let tag = row['母豬耳號(Sow Ear Tag)'] || '';
            return String(tag).toLowerCase().includes(query);
        });

        html += `<div class="section-title">II. 📊 Genetic Breeding Performance Indicators</div>`;
        if (matchedValue.length > 0) {
            matchedValue.forEach(row => {
                html += `
                <p><b>Target Ear Tag: ${row['母豬耳號(Sow Ear Tag)']} (Breed: ${row['品種(Breed)']||'N/A'})</b></p>
                <div class="card-grid">
                    <div class="card"><div class="card-label">Total Parities</div><div class="card-value">${row['累計記錄胎數(Total Parities)']||'N/A'}</div></div>
                    <div class="card"><div class="card-label">Selection Index</div><div class="card-value" style="color:#10B981;">${row['🏆 育種選拔指數(Selection Index)']||'N/A'}</div></div>
                    <div class="card"><div class="card-label">Farrowing Rate</div><div class="card-value">${row['個體成功分娩率(Farrowing Rate %)']||'0'}%</div></div>
                    <div class="card"><div class="card-label">Selection Comment</div><div class="card-value" style="font-size:12px;">${row['選拔評價與行動建議(Selection Comment)']||'N/A'}</div></div>
                </div>
                <div style="background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
                    <b>📈 Detailed Performance Averages:</b> 
                    Avg LWW: ${row['40% 總離乳窩重平均(Avg LWW)']||'0'} ｜ 
                    Avg PWS: ${row['35% 育成率平均(Avg PWS)']||'0'} ｜ 
                    Avg NBA: ${row['25% 產活仔數平均(Avg NBA)']||'0'} ｜ 
                    Mortality Date: ${row['☠️ 死亡日期(Date of Mortality)']||'Alive'}
                </div>
                `;
            });
        } else {
            html += `<p>No detailed breeding performance records found for this ear tag in the analysis table.</p>`;
        }

        resultsDiv.innerHTML = html;
    }
</script>
</body>
</html>
